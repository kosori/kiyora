name: Setup
description: Install the pinned toolchain and the workspace dependencies.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3

    - uses: actions/setup-node@v6
      with:
        node-version: 26.12.0

    - shell: bash
      run: bun install --frozen-lockfile
